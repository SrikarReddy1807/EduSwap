<!DOCTYPE html>
<html>
<head>
    <title>EduSwap - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: radial-gradient(circle at top, #8f1029, #2a0a10);
        }

        .login-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card-custom {
            width: 900px;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 80px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-left img {
            width: 380px;
            display: block;
            margin-left: -25px;
            filter: brightness(1.1);
        }

        .login-right {
            width: 320px;
        }

        .login-right h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
        }

        .login-right p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #ddd;
        }

        .login-right input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 14px;
        }

        .login-right input::placeholder {
            color: #bbb;
        }

        .login-right input:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.6);
        }

        .login-right button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #ff416c, #8f1029);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-right button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .register-link {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .register-link a {
            color: #ff4b2b;
            text-decoration: none;
            font-weight: 600;
        }

        .error {
            color: #ff6b6b;
            margin-bottom: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card-custom">
            <div class="login-left">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="EduSwap Logo">
            </div>

            <div class="login-right">
                <h1>EduSwap</h1>
                <p>Skill Based Matchmaking</p>

                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <input type="text" name="roll" placeholder="Roll Number" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>

                <div class="register-link">
                    New user? <a href="/register">Register</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
